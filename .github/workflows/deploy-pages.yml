name: 部署至 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 設定 GitHub Pages 部署權限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝專案依賴
        run: npm ci

      - name: 建置靜態網站 (Vite build)
        run: npm run build

      - name: 設定 GitHub Pages 資源
        uses: actions/configure-pages@v5

      - name: 上傳 Pages 產出成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
