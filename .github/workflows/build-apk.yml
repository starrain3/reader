name: 編譯 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝專案依賴
        run: npm ci

      - name: 安裝 Capacitor 依賴
        run: |
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android

      - name: 建置 Web 應用 (Vite build)
        run: npm run build

      - name: 初始化 Capacitor Android 專案
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 設定 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 編譯 Android APK (Debug 版本)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上傳 APK 至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ku-novel-reader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
